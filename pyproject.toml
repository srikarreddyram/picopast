[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "picopast"
version = "0.1.0"
description = "Evaluation and back-extension of PACE MOANA picophytoplankton estimates for the North Indian Ocean"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aryan Sinha" }, { name = "Ramachandra TejSrikar Reddy" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "xarray>=2024.1",
    "netCDF4>=1.6.5",
    "h5netcdf>=1.3",
    "h5py>=3.10",
    "zarr>=2.17",
    "dask>=2024.1",
    "pyyaml>=6",
    "requests>=2.31",
    "earthaccess>=0.9",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Weeks 4-6: routes A/B/C, intervals, explanation.
ml = ["xgboost>=2.0", "lightgbm>=4.3", "shap>=0.45"]
# Week 2: mixed-layer depth from GLORYS12.
copernicus = ["copernicusmarine>=1.3"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
picopast = "picopast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/picopast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: needs internet access (deselect with -m 'not network')"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B905"]
